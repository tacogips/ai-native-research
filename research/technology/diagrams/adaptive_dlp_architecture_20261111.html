-35-46-38-31-33-30-53-41-31-35"><rect x="410" y="344" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-50-34-4b-36-59-53-4a-31-35-46-38-31-33-30-53-41-31-35)"><text x="540" y="384" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">適用条件の判定</text><text x="540" y="408" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">種類別再現率・負荷</text></g></g><g data-id="01M7589XP8J0V3HHT4JH69K1PZ" data-type="node.generic"><rect x="0" y="344" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-50-38-4a-30-56-33-48-48-54-34-4a-48-36-39-4b-31-50-5a"><rect x="10" y="344" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-50-38-4a-30-56-33-48-48-54-34-4a-48-36-39-4b-31-50-5a)"><text x="140" y="384" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">並行検査と限定適用</text><text x="140" y="408" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">権限を限定した更新</text></g></g><g data-id="01M7589XPBPMSCF9BQ3Z66VYFK" data-type="node.generic"><rect x="0" y="544" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-50-42-50-4d-53-43-46-39-42-51-33-5a-36-36-56-59-46-4b"><rect x="10" y="544" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-50-42-50-4d-53-43-46-39-42-51-33-5a-36-36-56-59-46-4b)"><text x="140" y="584" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">本番の監査と監視</text><text x="140" y="608" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">全文標本・範囲・遅延</text></g></g><g data-id="01M7589XPFY2RM1FFP7PN17SWK" data-type="node.generic"><rect x="400" y="544" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-50-46-59-32-52-4d-31-46-46-50-37-50-4e-31-37-53-57-4b"><rect x="410" y="544" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-50-46-59-32-52-4d-31-46-46-50-37-50-4e-31-37-53-57-4b)"><text x="540" y="584" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">停止・旧版へ戻す</text><text x="540" y="608" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">影響対象を再検査</text></g></g><g data-id="01M7589XR93N9MMXQ7E9X4NE40" data-type="text.note"><text x="728" y="563.6" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">合格時のみ左へ進む。</text><text x="728" y="582.8" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">失敗した候補は本番へ配布しない。</text></g><g data-id="01M7589XRGGDCPDMS4TK8XJK9S" data-type="text.note"><text x="8" y="743.6" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">本番監査で得た判定は、上段の確定例へ戻る。監視悪化時は適用を止めて再検査する。</text></g><g data-id="01M7589XRQZCNRPG4MZ708SJ8B" data-type="text.note"><text x="8" y="791.6" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">機密種類の定義・モデル・指示文・知識・例示検索の索引は一つの適用版として固定する。</text></g></g>
