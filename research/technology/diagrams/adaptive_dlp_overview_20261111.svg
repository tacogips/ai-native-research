<g data-layer="shapes"><g data-id="01M7589XKB3EKWZ0EWNPJQ565J" data-type="text.note"><text x="8" y="25.2" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="32" font-family="Hiragino Sans">機密情報検知と継続改善</text></g><g data-id="01M7589XKC5642MEDXYC47H5MX" data-type="text.note"><text x="8" y="79.6" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">保存先以外は顧客ごとに分離した処理領域。外部モデル利用は明示許可した接続のみ。</text></g><g data-id="01M7589XKDBCNNF7PYKJJDB9GF" data-type="node.generic"><rect x="0" y="144" width="280" height="104" rx="8" fill="#ececec" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4b-44-42-43-4e-4e-46-37-50-59-4b-4a-4a-44-42-39-47-46"><rect x="10" y="144" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4b-44-42-43-4e-4e-46-37-50-59-4b-4a-4a-44-42-39-47-46)"><text x="140" y="184" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">保存先</text><text x="140" y="208" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">Google Drive・Box・S3</text></g></g><g data-id="01M7589XKGZRS0SV6JDYCY0B0P" data-type="node.generic"><rect x="400" y="144" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4b-47-5a-52-53-30-53-56-36-4a-44-59-43-59-30-42-30-50"><rect x="410" y="144" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4b-47-5a-52-53-30-53-56-36-4a-44-59-43-59-30-42-30-50)"><text x="540" y="184" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">発見と版確定</text><text x="540" y="208" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">差分取得＋全件照合</text></g></g><g data-id="01M7589XKHN2X508WYFXB3Z99V" data-type="node.generic"><rect x="800" y="144" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4b-48-4e-32-58-35-30-38-57-59-46-58-42-33-5a-39-39-56"><rect x="810" y="144" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4b-48-4e-32-58-35-30-38-57-59-46-58-42-33-5a-39-39-56)"><text x="940" y="184" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">隔離した本文抽出</text><text x="940" y="208" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">画像読取り・範囲記録</text></g></g><g data-id="01M7589XKJG59EH4RHRPP81G44" data-type="node.generic"><rect x="800" y="344" width="280" height="104" rx="8" fill="#fff2eb" stroke="#eb6c36" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4b-4a-47-35-39-45-48-34-52-48-52-50-50-38-31-47-34-34"><rect x="810" y="344" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4b-4a-47-35-39-45-48-34-52-48-52-50-50-38-31-47-34-34)"><text x="940" y="384" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">複数方式で独立検知</text><text x="940" y="408" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">規則・モデル・例示検索</text></g></g><g data-id="01M7589XKK2TG036RB59NRNT2D" data-type="node.generic"><rect x="400" y="344" width="280" height="104" rx="8" fill="#fff2eb" stroke="#eb6c36" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4b-4b-32-54-47-30-33-36-52-42-35-39-4e-52-4e-54-32-44"><rect x="410" y="344" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4b-4b-32-54-47-30-33-36-52-42-35-39-4e-52-4e-54-32-44)"><text x="540" y="384" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">候補と検査範囲の台帳</text><text x="540" y="408" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">許可・不明も保持</text></g></g><g data-id="01M7589XKQK6BPXCF63RZH6R0S" data-type="node.generic"><rect x="0" y="344" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4b-51-4b-36-42-50-58-43-46-36-33-52-5a-48-36-52-30-53"><rect x="10" y="344" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4b-51-4b-36-42-50-58-43-46-36-33-52-5a-48-36-52-30-53)"><text x="140" y="384" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">業務上の許可を評価</text><text x="140" y="408" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">場所×種類×共有×期限</text></g></g><g data-id="01M7589XKRW4702X64XEDPSYEA" data-type="node.generic"><rect x="0" y="544" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4b-52-57-34-37-30-32-58-36-34-58-45-44-50-53-59-45-41"><rect x="10" y="544" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4b-52-57-34-37-30-32-58-36-34-58-45-44-50-53-59-45-41)"><text x="140" y="584" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">通知と未解決管理</text><text x="140" y="608" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">原文を通知に載せない</text></g></g><g data-id="01M7589XKTPXABT8M4XNTMZT62" data-type="node.generic"><rect x="400" y="544" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4b-54-50-58-41-42-54-38-4d-34-58-4e-54-4d-5a-54-36-32"><rect x="410" y="544" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4b-54-50-58-41-42-54-38-4d-34-58-4e-54-4d-5a-54-36-32)"><text x="540" y="584" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">人の確認と標本監査</text><text x="540" y="608" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">陽性・陰性の全文検査</text></g></g><g data-id="01M7589XKX7EZYQYBCSFE1PTE2" data-type="node.generic"><rect x="800" y="544" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4b-58-37-45-5a-59-51-59-42-43-53-46-45-31-50-54-45-32"><rect x="810" y="544" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4b-58-37-45-5a-59-51-59-42-43-53-46-45-31-50-54-45-32)"><text x="940" y="584" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">知識と自動改善</text><text x="940" y="608" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">評価合格版のみ適用</text></g></g><g data-id="01M7589XN8P01Y8K2S4MHZ43B2" data-type="text.note"><text x="8" y="743.6" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">矢印：データまたは適用版の流れ　｜　橙色：検知と全件記録の中核</text></g><g data-id="01M7589XNDZZG01CFE10S5C7KB" data-type="text.note"><text x="8" y="791.6" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">未検査は陰性にしない。人の「業務上許可」を「誤検知」の学習ラベルにしない。</text></g></g>
</svg>
