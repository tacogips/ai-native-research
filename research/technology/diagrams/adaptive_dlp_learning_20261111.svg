<rect x="-32" y="-32" width="1184" height="904" fill="#f5f5f5" />
<g data-layer="connectors"><g data-id="01M7589XPJYS915Z370R34YJKP" data-type="edge.generic"><polyline points="280,196 340,196 400,196" fill="none" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#nodetto-arrow)" /></g><g data-id="01M7589XPR10SRA79BEG2BGEPP" data-type="edge.generic"><polyline points="680,196 740,196 800,196" fill="none" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#nodetto-arrow)" /></g><g data-id="01M7589XQ06C4F301A21BYRHE9" data-type="edge.generic"><polyline points="940,248 940,296 940,344" fill="none" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#nodetto-arrow)" /></g><g data-id="01M7589XQ7YP1RP4SBHDKQDA64" data-type="edge.generic"><polyline points="800,396 740,396 680,396" fill="none" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#nodetto-arrow)" /></g><g data-id="01M7589XQEQTNJCXJSX3SRPG55" data-type="edge.generic"><polyline points="400,396 340,396 280,396" fill="none" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#nodetto-arrow)" /></g><g data-id="01M7589XQNAN0TB2PZZJE30B76" data-type="edge.generic"><polyline points="140,448 140,496 140,544" fill="none" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#nodetto-arrow)" /></g><g data-id="01M7589XR088GF6S319RSB1XNV" data-type="edge.generic"><polyline points="280,596 340,596 400,596" fill="none" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#nodetto-arrow)" /></g></g>
<g data-layer="shapes"><g data-id="01M7589XNF11JSF7S6MCW69V0E" data-type="text.note"><text x="8" y="25.2" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="32" font-family="Hiragino Sans">人の判定から検知を改善する</text></g><g data-id="01M7589XNMDMW6QKP77SD9ZCRW" data-type="text.note"><text x="8" y="79.6" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">自動生成・自動評価・条件付き自動適用。高機密種類などは責任者が承認する。</text></g><g data-id="01M7589XNPZCE03SH0BV3CCTJB" data-type="node.generic"><rect x="0" y="144" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4e-50-5a-43-45-30-33-53-48-30-42-56-33-43-43-54-4a-42"><rect x="10" y="144" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4e-50-5a-43-45-30-33-53-48-30-42-56-33-43-43-54-4a-42)"><text x="140" y="184" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">独立した人の判定</text><text x="140" y="208" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">見逃し箇所も追加</text></g></g><g data-id="01M7589XNVB1NZ4TJJD16EESS4" data-type="node.generic"><rect x="400" y="144" width="280" height="104" rx="8" fill="#fff2eb" stroke="#eb6c36" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4e-56-42-31-4e-5a-34-54-4a-4a-44-31-36-45-45-53-53-34"><rect x="410" y="144" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4e-56-42-31-4e-5a-34-54-4a-4a-44-31-36-45-45-53-53-34)"><text x="540" y="184" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">確定例と失敗知識</text><text x="540" y="208" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">出所・版・期限・系譜</text></g></g><g data-id="01M7589XNX8KC3QPF37R30KX65" data-type="node.generic"><rect x="800" y="144" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-4e-58-38-4b-43-33-51-50-46-33-37-52-33-30-4b-58-36-35"><rect x="810" y="144" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-4e-58-38-4b-43-33-51-50-46-33-37-52-33-30-4b-58-36-35)"><text x="940" y="184" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">改善候補の自動生成</text><text x="940" y="208" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">指示文・例示・規則・設定</text></g></g><g data-id="01M7589XP1MTTFWF8M1XD4CWXY" data-type="node.generic"><rect x="800" y="344" width="280" height="104" rx="8" fill="#fff2eb" stroke="#eb6c36" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-50-31-4d-54-54-46-57-46-38-4d-31-58-44-34-43-57-58-59"><rect x="810" y="344" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-50-31-4d-54-54-46-57-46-38-4d-31-58-44-34-43-57-58-59)"><text x="940" y="384" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">独立した比較評価</text><text x="940" y="408" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">固定試験＋新期間標本</text></g></g><g data-id="01M7589XP4K6YSJ15F8130SA15" data-type="node.generic"><rect x="400" y="344" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-50-34-4b-36-59-53-4a-31-35-46-38-31-33-30-53-41-31-35"><rect x="410" y="344" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-50-34-4b-36-59-53-4a-31-35-46-38-31-33-30-53-41-31-35)"><text x="540" y="384" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">適用条件の判定</text><text x="540" y="408" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">種類別再現率・負荷</text></g></g><g data-id="01M7589XP8J0V3HHT4JH69K1PZ" data-type="node.generic"><rect x="0" y="344" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-50-38-4a-30-56-33-48-48-54-34-4a-48-36-39-4b-31-50-5a"><rect x="10" y="344" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-50-38-4a-30-56-33-48-48-54-34-4a-48-36-39-4b-31-50-5a)"><text x="140" y="384" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">並行検査と限定適用</text><text x="140" y="408" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">権限を限定した更新</text></g></g><g data-id="01M7589XPBPMSCF9BQ3Z66VYFK" data-type="node.generic"><rect x="0" y="544" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-50-42-50-4d-53-43-46-39-42-51-33-5a-36-36-56-59-46-4b"><rect x="10" y="544" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-50-42-50-4d-53-43-46-39-42-51-33-5a-36-36-56-59-46-4b)"><text x="140" y="584" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">本番の監査と監視</text><text x="140" y="608" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">全文標本・範囲・遅延</text></g></g><g data-id="01M7589XPFY2RM1FFP7PN17SWK" data-type="node.generic"><rect x="400" y="544" width="280" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2" /><defs><clipPath id="node-label-30-31-4d-37-35-38-39-58-50-46-59-32-52-4d-31-46-46-50-37-50-4e-31-37-53-57-4b"><rect x="410" y="544" width="260" height="104" /></clipPath></defs><g clip-path="url(#node-label-30-31-4d-37-35-38-39-58-50-46-59-32-52-4d-31-46-46-50-37-50-4e-31-37-53-57-4b)"><text x="540" y="584" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">停止・旧版へ戻す</text><text x="540" y="608" text-anchor="middle" dominant-baseline="central" fill="#2d3142" font-size="20" xml:space="preserve" font-family="Hiragino Sans">影響対象を再検査</text></g></g><g data-id="01M7589XR93N9MMXQ7E9X4NE40" data-type="text.note"><text x="728" y="563.6" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">合格時のみ左へ進む。</text><text x="728" y="582.8" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">失敗した候補は本番へ配布しない。</text></g><g data-id="01M7589XRGGDCPDMS4TK8XJK9S" data-type="text.note"><text x="8" y="743.6" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">本番監査で得た判定は、上段の確定例へ戻る。監視悪化時は適用を止めて再検査する。</text></g><g data-id="01M7589XRQZCNRPG4MZ708SJ8B" data-type="text.note"><text x="8" y="791.6" xml:space="preserve" style="white-space: pre;" text-anchor="start" dominant-baseline="central" fill="#2d3142" font-size="16" font-family="Hiragino Sans">機密種類の定義・モデル・指示文・知識・例示検索の索引は一つの適用版として固定する。</text></g></g>
</svg>
